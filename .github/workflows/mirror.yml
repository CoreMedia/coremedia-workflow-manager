name: Mirror to coremedia-contributions

on:
  push:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.MIRROR_CM_2_CM_CONTRIBUTIONS_APP_ID }}
          private-key: ${{ secrets.MIRROR_CM_2_CM_CONTRIBUTIONS_APP_KEY }}
          owner: coremedia-contributions
          repositories: coremedia-workflow-manager

      - name: Mirror repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          git clone --mirror https://x-access-token:${SOURCE_TOKEN}@github.com/${SOURCE_REPOSITORY}.git repo.git
          cd repo.git
          git push --mirror https://x-access-token:${GH_TOKEN}@github.com/coremedia-contributions/coremedia-workflow-manager.git
