name: Mirror to coremedia-contributions

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

concurrency:
  group: mirror-to-contributions
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Create GitHub App token (Ziel-Org)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.MIRROR_CM_2_CM_CONTRIBUTIONS_CLIENT_ID }}
          private-key: ${{ secrets.MIRROR_CM_2_CM_CONTRIBUTIONS_APP_KEY }}
          owner: coremedia-contributions
          repositories: coremedia-workflow-manager

      - name: Mirror repository
        env:
          SRC_TOKEN: ${{ github.token }}
          DST_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          SRC_URL="https://x-access-token:${SRC_TOKEN}@github.com/CoreMedia/coremedia-workflow-manager.git"
          DST_URL="https://x-access-token:${DST_TOKEN}@github.com/coremedia-contributions/coremedia-workflow-manager.git"

          # Bare-Mirror-Clone der Quelle
          git clone --mirror "${SRC_URL}" repo.git
          cd repo.git

          # WICHTIG: Mirror-Flag entfernen, sonst pusht 'git push' trotzdem ALLE Refs
          # (inkl. der read-only refs/pull/*), was GitHub ablehnt.
          git config --unset remote.origin.mirror || true

          # GitHub-eigene, read-only Refs lokal löschen
          git for-each-ref --format='delete %(refname)' 'refs/pull/*' \
            | git update-ref --stdin || true

          # Nur echte Branches und Tags spiegeln, mit Prune fürs Aufräumen im Ziel.
          git push --prune "${DST_URL}" \
            'refs/heads/*:refs/heads/*' \
            'refs/tags/*:refs/tags/*'
